<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduMate AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="chat-container">
    <section class="chat-header">
      <h1>EduMate AI</h1>
      <p>Asisten belajar pintar berbasis Gemini AI</p>
    </section>

    <section id="chat-box" class="chat-box">
      <div class="message bot">
        Halo! Aku EduMate AI. Mau belajar apa hari ini?
      </div>
    </section>

    <form id="chat-form" class="chat-form">
      <input
        type="text"
        id="user-input"
        placeholder="Tanyakan materi pelajaran..."
        autocomplete="off"
      />
      <button type="submit">Kirim</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
